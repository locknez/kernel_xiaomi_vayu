name: Build Vayu KernelSU-Next

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Kernel source branch
        required: true
        default: sixteen

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: tejas101k/kernel_xiaomi_vayu
          ref: ${{ inputs.branch }}
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev cpio kmod rsync python3 gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Integrate KernelSU-Next
        run: |
          rm -rf KernelSU-Next
          git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          bash KernelSU-Next/kernel/setup.sh

      - name: Fix XDP structure placement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          xdp = Path("include/net/xdp.h")
          filt = Path("include/linux/filter.h")

          xdp_s = xdp.read_text()
          filt_s = filt.read_text()

          pattern = re.compile(
              r'(?ms)^[ \t]*struct[ \t]+xdp_buff[ \t]*\{.*?^[ \t]*\};[ \t]*\n?'
          )

          block = """struct xdp_buff {
              void *data;
              void *data_end;
              void *data_meta;
              void *data_hard_start;
              struct xdp_rxq_info *rxq;
          };

          """

          filt_s, removed = pattern.subn("", filt_s)
          xdp_s, xdp_removed = pattern.subn("", xdp_s)

          marker = "struct xdp_frame {\n"
          if marker not in xdp_s:
              raise SystemExit("Cannot find struct xdp_frame in include/net/xdp.h")

          xdp_s = xdp_s.replace(marker, block + marker, 1)

          xdp.write_text(xdp_s)
          filt.write_text(filt_s)

          xdp_final = xdp.read_text()
          filt_final = filt.read_text()

          xdp_count = len(pattern.findall(xdp_final))
          filt_count = len(pattern.findall(filt_final))

          print(f"Removed {removed} old definition(s) from filter.h")
          print(f"Removed {xdp_removed} old definition(s) from xdp.h before reinserting")
          print(f"Final xdp.h definitions: {xdp_count}")
          print(f"Final filter.h definitions: {filt_count}")

          if xdp_count != 1:
              raise SystemExit("xdp.h must contain exactly one struct xdp_buff definition")
          if filt_count != 0:
              raise SystemExit("filter.h still contains struct xdp_buff")

          print("XDP structure placement: OK")
          PY

      - name: Configure Vayu
        run: |
          make ARCH=arm64 vayu_user_defconfig
          ./scripts/config --enable KPROBES
          ./scripts/config --enable KSU
          ./scripts/config --enable EXT4_FS

          # Disable BPF JIT because this kernel's ARM64 BPF JIT
          # expects struct members (is_func/jit_data) not present
          # in this kernel source.
          ./scripts/config --disable BPF_JIT

          make ARCH=arm64 olddefconfig

      - name: Verify BPF configuration
        run: |
          grep -E '^CONFIG_(BPF|BPF_SYSCALL|BPF_JIT|KPROBES|KSU|EXT4_FS)=' .config || true

      - name: Build kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make -j2 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- Image.gz-dtb

      - name: Verify kernel output
        run: |
          set -eux
          ls -lh arch/arm64/boot/
          test -f arch/arm64/boot/Image.gz-dtb

      - name: Collect kernel
        run: |
          mkdir -p artifacts
          cp arch/arm64/boot/Image.gz-dtb artifacts/Image.gz-dtb

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: vayu-kernel-KSU-Next
          path: artifacts/Image.gz-dtb
          if-no-files-found: error
          
