name: Build Vayu -Next

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Kernel source branch
        required: true
        default: sixteen

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: tejas101k/kernel_xiaomi_vayu
          ref: ${{ inputs.branch }}
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev \
            cpio kmod rsync python3 \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Integrate KernelSU-Next
        run: |
          rm -rf KernelSU-Next
          git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          bash KernelSU-Next/kernel/setup.sh

      - name: Repair missing XDP structure
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("include/net/xdp.h")
          s = p.read_text()

          if "struct xdp_buff {" in s:
              print("struct xdp_buff already exists; no patch needed")
          else:
              marker = "struct xdp_frame {\n"
              patch = """struct xdp_buff {
              void *data;
              void *data_end;
              void *data_meta;
              void *data_hard_start;
              struct xdp_rxq_info *rxq;
          };

          """
              if marker not in s:
                  raise SystemExit("Cannot find xdp_frame marker in include/net/xdp.h")
              p.write_text(s.replace(marker, patch + marker, 1))
              print("Inserted missing struct xdp_buff")

          check = p.read_text()
          if "struct xdp_buff {" not in check:
              raise SystemExit("XDP repair verification failed")

          start = check.find("struct xdp_buff {")
          print("=== XDP definition check ===")
          print(check[start:start + 220])
          PY

      - name: Configure Vayu
        run: |
          make ARCH=arm64 vayu_user_defconfig

          ./scripts/config --enable KPROBES
          ./scripts/config --enable KSU
          ./scripts/config --enable EXT4_FS

          make ARCH=arm64 olddefconfig

          echo "=== Final configuration ==="
          grep -E '^CONFIG_(KPROBES|KSU|EXT4_FS)=' .config

          echo "=== XDP/BPF configuration ==="
          grep -E '^CONFIG_(BPF|BPF_SYSCALL|XDP|XDP_SOCKETS|NETFILTER)=' .config || true

      - name: Build kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          make -j2 \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image.gz-dtb

      - name: Verify kernel output
        run: |
          set -eux
          ls -lh arch/arm64/boot/
          test -f arch/arm64/boot/Image.gz-dtb

      - name: Collect kernel
        run: |
          mkdir -p artifacts
          cp arch/arm64/boot/Image.gz-dtb artifacts/Image.gz-dtb

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: vayu-kernel-KSU-Next
          path: artifacts/Image.gz-dtb
          if-no-files-found: error

