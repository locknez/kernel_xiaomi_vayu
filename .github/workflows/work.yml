name: Build Vayu KernelSU-Next

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Kernel source branch
        required: true
        default: sixteen

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: tejas101k/kernel_xiaomi_vayu
          ref: ${{ inputs.branch }}
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev \
            cpio kmod rsync python3 \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Integrate KernelSU-Next
        run: |
          rm -rf KernelSU-Next
          git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          bash KernelSU-Next/kernel/setup.sh

      - name: Fix XDP structure placement
        run: |
          python3 - <<'PY'
          from pathlib import Path

          xdp = Path("include/net/xdp.h")
          filt = Path("include/linux/filter.h")

          xdp_s = xdp.read_text()
          filt_s = filt.read_text()

          block = """struct xdp_buff {
              void *data;
              void *data_end;
              void *data_meta;
              void *data_hard_start;
              struct xdp_rxq_info *rxq;
          };

          """

          # Move struct xdp_buff into include/net/xdp.h.
          if "struct xdp_buff {" not in xdp_s:
              marker = "struct xdp_frame {\n"
              if marker not in xdp_s:
                  raise SystemExit("Cannot find struct xdp_frame in include/net/xdp.h")
              xdp_s = xdp_s.replace(marker, block + marker, 1)
              xdp.write_text(xdp_s)
              print("Inserted struct xdp_buff into include/net/xdp.h")
          else:
              print("struct xdp_buff already exists in include/net/xdp.h")

          # Remove the old duplicate definition from include/linux/filter.h.
          old = """struct xdp_buff {
              void *data;
              void *data_end;
              void *data_meta;
              void *data_hard_start;
              struct xdp_rxq_info *rxq;
          };

          """
          if old in filt_s:
              filt_s = filt_s.replace(old, "", 1)
              filt.write_text(filt_s)
              print("Removed duplicate struct xdp_buff from include/linux/filter.h")
          else:
              print("No duplicate struct xdp_buff block found in filter.h")

          # Hard verification: exactly one definition must remain.
          x = xdp.read_text()
          f = filt.read_text()

          if x.count("struct xdp_buff {") != 1:
              raise SystemExit("xdp.h must contain exactly one struct xdp_buff definition")
          if f.count("struct xdp_buff {") != 0:
              raise SystemExit("filter.h still contains a duplicate struct xdp_buff definition")

          print("XDP structure placement: OK")
          PY

      - name: Configure Vayu
        run: |
          make ARCH=arm64 vayu_user_defconfig
          ./scripts/config --enable KPROBES
          ./scripts/config --enable KSU
          ./scripts/config --enable EXT4_FS
          make ARCH=arm64 olddefconfig

          echo "=== Final configuration ==="
          grep -E '^CONFIG_(KPROBES|KSU|EXT4_FS)=' .config

      - name: Build kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make -j2 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- Image.gz-dtb

      - name: Verify kernel output
        run: |
          set -eux
          ls -lh arch/arm64/boot/
          test -f arch/arm64/boot/Image.gz-dtb

      - name: Collect kernel
        run: |
          mkdir -p artifacts
          cp arch/arm64/boot/Image.gz-dtb artifacts/Image.gz-dtb

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: vayu-kernel-KSU-Next
          path: artifacts/Image.gz-dtb
          if-no-files-found: error
